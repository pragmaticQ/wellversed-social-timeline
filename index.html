<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wellomians Social Timeline</title>
  <style>
    body {
      margin: 0;
      padding: 60px 24px;
      background: #0b0d17;
      color: #f7f5f2;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: clamp(42px, 8vw, 82px);
      font-weight: 400;
      line-height: .95;
      margin: 0 0 20px;
    }

    h1 em {
      color: #b7a3ff;
    }

    .intro {
      max-width: 620px;
      color: rgba(247,245,242,.65);
      font-size: 17px;
      line-height: 1.6;
      margin-bottom: 44px;
    }

    .directory {
      display: grid;
      gap: 12px;
    }

    .person {
      display: grid;
      grid-template-columns: 42px 1fr auto;
      align-items: center;
      gap: 16px;
      padding: 22px;
      color: inherit;
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 18px;
      background: rgba(255,255,255,.03);
      transition: .3s ease;
    }

    .person:hover {
      transform: translateY(-4px);
      border-color: #b7a3ff;
      background: rgba(124,92,255,.12);
    }

    .number {
      color: #b7a3ff;
      font-family: monospace;
      font-size: 12px;
    }

    .name {
      font-family: Georgia, serif;
      font-size: 24px;
    }

    .meta {
      margin-top: 5px;
      color: rgba(247,245,242,.5);
      font-size: 13px;
    }

    .arrow {
      color: #b7a3ff;
      font-size: 22px;
    }

    footer {
      margin-top: 70px;
      color: rgba(247,245,242,.4);
      font-family: monospace;
      font-size: 11px;
      letter-spacing: .08em;
    }
  </style>
</head>
<body>
  <main class="container">
    <p>WELLVERSED / SOCIAL TIMELINE</p>

    <h1>Meet the<br><em>Wellomians.</em></h1>

    <p class="intro">
      A collection of signals, stories, ambitions, and unfinished chapters
      from the people who make Wellversed what it is.
    </p>

    <section class="directory">
      <a class="person" href="profiles/aasika-jain.html">
        <span class="number">01</span>
        <span>
          <span class="name">Aasika Jain</span>
          <span class="meta">Deep-Thinker · Kolkata · ENFJ-T</span>
        </span>
        <span class="arrow">→</span>
      </a>
    </section>

    <footer>BE YOU. BE WELLVERSED.</footer>
  </main>
</body>
</html>
